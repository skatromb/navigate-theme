name: publish

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm run package

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@^4.1.0 publish --oidc --packagePath navigate.vsix
